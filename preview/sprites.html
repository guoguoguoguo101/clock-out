<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>角色精灵图</title>
  <style>
    :root { --bg:#f4f6f8; --ink:#1b1e24; --muted:#6b7280; --line:#e5e7eb; --cyan:#00b8d4; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    main { max-width:1180px; margin:0 auto; padding:36px 24px 80px; }
    h1 { font-size:30px; margin:0 0 8px; }
    .lead { color:var(--muted); line-height:1.6; max-width:780px; }
    h2 { font-size:18px; margin:36px 0 12px; }
    .tabs { display:flex; gap:8px; flex-wrap:wrap; margin:20px 0 8px; }
    .tabs button {
      border:1px solid var(--line); background:#fff; color:var(--ink);
      border-radius:999px; padding:8px 16px; cursor:pointer; font-size:14px;
    }
    .tabs button.on { background:var(--ink); color:#fff; border-color:var(--ink); }
    .strip { width:100%; background:#fff; border:1px solid var(--line); border-radius:16px; padding:12px; }
    .strip img { width:100%; height:auto; display:block; }
    .row { display:flex; flex-wrap:wrap; gap:12px; }
    figure { margin:0; width:160px; background:#fff; border:1px solid var(--line); border-radius:14px; padding:8px; text-align:center; }
    figure img, .stage .box {
      background:
        linear-gradient(45deg,#eceff4 25%,transparent 25%),
        linear-gradient(-45deg,#eceff4 25%,transparent 25%),
        linear-gradient(45deg,transparent 75%,#eceff4 75%),
        linear-gradient(-45deg,transparent 75%,#eceff4 75%);
      background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0; background-color:#fff;
    }
    figure img { width:100%; height:150px; object-fit:contain; border-radius:10px; }
    figcaption { font-size:12px; color:var(--muted); margin-top:6px; }
    .play { display:flex; gap:28px; flex-wrap:wrap; margin-top:8px; }
    .stage { width:180px; text-align:center; }
    .stage .box {
      width:180px; height:180px; border-radius:16px; border:1px solid var(--line);
      display:flex; align-items:center; justify-content:center;
    }
    .stage img { width:160px; height:160px; object-fit:contain; }
    .stage p { margin:8px 0 0; font-size:13px; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <h1>角色 2D 精灵图</h1>
  <p class="lead">小马、小兔子、牛、鹈鹕、袋鼠同一套扁平剪影。每个动作 4 帧，可切换角色看循环和单帧。</p>
  <div class="tabs" id="tabs"></div>

  <h2>循环播放</h2>
  <div class="play" id="play"></div>

  <h2>站立</h2>
  <div class="strip"><img id="strip-idle" alt="站立条带"></div>
  <div class="row" id="idle"></div>

  <h2>走路</h2>
  <div class="strip"><img id="strip-walk" alt="走路条带"></div>
  <div class="row" id="walk"></div>

  <h2>奔跑</h2>
  <div class="strip"><img id="strip-run" alt="奔跑条带"></div>
  <div class="row" id="run"></div>

  <h2>工作</h2>
  <div class="strip"><img id="strip-work" alt="工作条带"></div>
  <div class="row" id="work"></div>

  <h2>休息</h2>
  <div class="strip"><img id="strip-rest" alt="休息条带"></div>
  <div class="row" id="sleep"></div>

  <h2>上厕所</h2>
  <div class="strip"><img id="strip-toilet" alt="上厕所条带"></div>
  <div class="row" id="toilet"></div>

  <div id="ride-section">
    <h2>骑车</h2>
    <div class="strip"><img id="strip-ride" alt="骑车条带"></div>
    <div class="row" id="ride"></div>
  </div>
</main>
<script>
  const CHARS = [
    { id: "horse", name: "小马" },
    { id: "rabbit", name: "小兔子" },
    { id: "cow", name: "牛" },
    { id: "pelican", name: "鹈鹕" },
    { id: "kangaroo", name: "袋鼠" },
  ];
  const GROUPS = {
    idle: ["idle_0","idle_1","idle_2","idle_3"],
    walk: ["walk_0","walk_1","walk_2","walk_3"],
    run: ["run_0","run_1","run_2","run_3"],
    work: ["work_0","work_1","work_2","work_3"],
    sleep: ["sleep_0","sleep_1","sleep_2","sleep_3"],
    toilet: ["toilet_0","toilet_1","toilet_2","toilet_3"],
    ride: ["ride_0","ride_1","ride_2","ride_3"],
  };
  const STRIP_FILE = {
    idle: "idle", walk: "walk", run: "run", work: "work", sleep: "rest", toilet: "toilet", ride: "ride"
  };
  const LABELS = { idle:"站立", walk:"走路", run:"奔跑", work:"工作", sleep:"休息", toilet:"上厕所", ride:"骑车" };
  const FPS = { idle:4, walk:8, run:10, work:5, sleep:4, toilet:5, ride:5 };

  let current = new URLSearchParams(location.search).get("char") || "horse";
  if (!CHARS.some(c => c.id === current)) current = "horse";
  const timers = [];

  const tabs = document.getElementById("tabs");
  CHARS.forEach((c) => {
    const btn = document.createElement("button");
    btn.textContent = c.name;
    btn.className = c.id === current ? "on" : "";
    btn.onclick = () => {
      current = c.id;
      history.replaceState(null, "", `?char=${c.id}`);
      [...tabs.children].forEach(b => b.classList.toggle("on", b === btn));
      render();
    };
    tabs.appendChild(btn);
  });

  function src(name) {
    return `sprites/${current}/${name}.png`;
  }

  function groups() {
    const g = { ...GROUPS };
    if (current !== "kangaroo") delete g.ride;
    return g;
  }

  function render() {
    timers.splice(0).forEach(clearInterval);
    const rideSec = document.getElementById("ride-section");
    if (rideSec) rideSec.style.display = current === "kangaroo" ? "" : "none";
    Object.entries(groups()).forEach(([id, names]) => {
      document.getElementById(id).innerHTML = names.map(n =>
        `<figure><img src="${src(n)}" alt="${n}"><figcaption>${n}</figcaption></figure>`
      ).join("");
      const stripId = id === "sleep" ? "rest" : id;
      const strip = document.getElementById("strip-" + stripId);
      strip.src = src(`${current}_${STRIP_FILE[id]}_strip.png`);
    });
    const play = document.getElementById("play");
    play.innerHTML = "";
    Object.entries(groups()).forEach(([id, names]) => {
      const stage = document.createElement("div");
      stage.className = "stage";
      stage.innerHTML = `<div class="box"><img alt="${id}"></div><p>${LABELS[id]}</p>`;
      const img = stage.querySelector("img");
      let i = 0;
      img.src = src(names[0]);
      timers.push(setInterval(() => {
        i = (i + 1) % names.length;
        img.src = src(names[i]);
      }, 1000 / FPS[id]));
      play.appendChild(stage);
    });
  }
  render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>六点下班 · 过场预览</title>
  <style>
    :root {
      --bg:#0e1116; --panel:#161b22; --ink:#e8edf4; --muted:#8b95a7;
      --line:#2a3340; --accent:#3ee0f2; --warn:#f4c14a; --fire:#e1251b;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
      font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    body { display:grid; grid-template-columns:280px 1fr; }
    aside {
      border-right:1px solid var(--line); padding:18px 14px 32px;
      overflow:auto; background:#10151c;
    }
    h1 { font-size:18px; margin:0 0 6px; }
    .lead { color:var(--muted); font-size:12px; line-height:1.5; margin:0 0 16px; }
    .lead a { color:var(--accent); }
    .group { color:var(--accent); font-size:11px; margin:14px 0 6px; letter-spacing:.04em; }
    .clip {
      width:100%; text-align:left; border:1px solid var(--line); background:var(--panel);
      color:var(--ink); border-radius:10px; padding:8px 10px; margin:0 0 6px; cursor:pointer;
    }
    .clip:hover { border-color:#3d4a5c; }
    .clip.on { border-color:var(--fire); background:#2a1212; }
    .clip:disabled { opacity:.45; cursor:not-allowed; }
    .clip b { display:block; font-size:13px; }
    .clip span { display:block; color:var(--muted); font-size:11px; margin-top:2px; }
    .row { display:flex; gap:8px; margin:12px 0 4px; }
    .row button {
      flex:1; border:1px solid var(--line); background:var(--panel); color:var(--ink);
      border-radius:8px; padding:7px 8px; cursor:pointer;
    }
    label.loop { font-size:12px; color:var(--muted); display:flex; gap:6px; align-items:center; }
    stage-wrap, .stage-wrap { position:relative; min-height:100vh; overflow:hidden; }
    .stage {
      position:absolute; inset:0;
      background:
        radial-gradient(1200px 600px at 70% 40%, #2a3344 0%, transparent 55%),
        linear-gradient(#1a222c, #0b0e13);
    }
    .veil { position:absolute; inset:0; background:#1a0506; opacity:0; pointer-events:none; }
    .flash { position:absolute; inset:0; background:#ffd4cc; opacity:0; pointer-events:none; }
    .paper, .stamp, .imprint, .title, .fire, .bang, .kick .clock, .kick .ttl, .shadow, .next, .react, .debris, .dream {
      position:absolute; pointer-events:none;
    }
    .paper { width:min(38vh, 340px); left:24%; top:14%; opacity:0; transform:scale(.86) rotate(4deg); z-index:2; }
    .stamp { width:min(42vh, 340px); left:46%; top:-70%; opacity:0; transform:scale(2.2) rotate(-18deg); z-index:5; }
    .imprint { width:min(40vw, 460px); left:24%; top:56%; opacity:0; transform:scale(.7) rotate(-5deg); z-index:3; }
    .copy { position:absolute; left:25%; top:57%; width:min(38vw, 430px); text-align:center; z-index:4; opacity:0; transform:scale(.2) rotate(-5deg); }
    .copy h2 { margin:14px 0 0; color:#ea1414; font-size:clamp(40px, 5.4vw, 62px); letter-spacing:.04em; text-shadow:0 2px 0 #4a0808, 0 0 18px #7a1010; }
    .copy p { margin:2px 0 0; color:#b10a0c; letter-spacing:.28em; font-weight:800; font-size:clamp(18px, 2.2vw, 28px); }
    .bang { left:1%; top:18%; width:min(34vh, 280px); opacity:0; transform:rotate(-18deg) scale(.35); z-index:8; }
    .dream { position:absolute; left:6%; top:50%; color:#d42822; font-size:18px; font-weight:700; transform:rotate(-12deg); opacity:0; z-index:7; text-shadow:0 1px 0 #3a0606; }
    .shadow { position:absolute; right:0; bottom:0; height:92%; opacity:0; z-index:0; pointer-events:none; }
    .next { position:absolute; right:8%; top:10%; width:160px; opacity:0; transform:scale(.4); z-index:6; }
    .react { position:absolute; left:3%; bottom:6%; width:120px; opacity:0; transform:scale(.7); z-index:6; }
    .debris { position:absolute; left:18%; top:8%; width:62%; opacity:0; z-index:7; pointer-events:none; }
    .kick { position:absolute; left:50%; top:8%; transform:translateX(-50%) scale(.72); opacity:0; display:flex; align-items:center; gap:8px; }
    .kick img.clock { width:96px; height:96px; }
    .kick img.ttl { height:84px; width:auto; max-width:70vw; }
    .hud {
      position:absolute; right:18px; top:18px; z-index:8;
      background:rgba(16,21,28,.82); border:1px solid var(--line);
      border-radius:12px; padding:10px 12px; font-size:12px; color:var(--muted); max-width:280px;
    }
    .hud b { color:var(--ink); }
    .assets { display:flex; gap:8px; margin-top:8px; }
    .assets img { height:44px; background:#1a1f28; border-radius:8px; padding:4px; }
    body.play-fired .veil { animation: veil 2.6s ease forwards; }
    body.play-fired .paper { animation: paper 2.6s ease forwards; }
    body.play-fired .stamp { animation: stamp 2.6s cubic-bezier(.55,0,.85,.45) forwards; }
    body.play-fired .imprint { animation: imprint 2.6s ease forwards; }
    body.play-fired .copy { animation: copy 2.6s cubic-bezier(.2,1.4,.4,1) forwards; }
    body.play-fired .bang { animation: bang 2.6s cubic-bezier(.2,1.6,.4,1) forwards; }
    body.play-fired .dream { animation: dream 2.6s ease forwards; }
    body.play-fired .shadow { animation: shadow 2.6s ease forwards; }
    body.play-fired .next { animation: next 2.6s cubic-bezier(.2,1.4,.4,1) forwards; }
    body.play-fired .react { animation: react 2.6s cubic-bezier(.2,1.4,.4,1) forwards; }
    body.play-fired .debris { animation: debris 2.6s ease forwards; }
    body.play-fired .flash { animation: flash 2.6s linear forwards; }
    body.play-fired .stage { animation: shake 2.6s linear forwards; }
    body.play-kick .kick { animation: kick 2.8s ease forwards; }
    body.play-kick .veil { animation: veilSoft 2.8s ease forwards; }
    @keyframes veil { 0%{opacity:0} 8%{opacity:.72} 100%{opacity:.48} }
    @keyframes veilSoft { 0%{opacity:0} 10%{opacity:.28} 80%{opacity:.18} 100%{opacity:0} }
    @keyframes paper { 0%{opacity:0;transform:scale(.86) rotate(4deg)} 12%{opacity:1;transform:scale(1) rotate(0)} 100%{opacity:1;transform:scale(1) rotate(0)} }
    @keyframes stamp {
      0%{opacity:1;top:-70%;transform:scale(2.2) rotate(-18deg)}
      14%{opacity:1;top:4%;transform:scale(1.08) rotate(-6deg)}
      17%{transform:scale(1.16,.78) rotate(-6deg)}
      21%{transform:scale(1) rotate(-6deg); top:4%}
      78%{opacity:1; top:4%}
      100%{opacity:0; top:-2%; transform:scale(1) rotate(-6deg)}
    }
    @keyframes imprint { 0%,20%{opacity:0;transform:scale(.7) rotate(-5deg)} 28%{opacity:1;transform:scale(1.08) rotate(-5deg)} 34%,100%{opacity:1;transform:scale(1) rotate(-5deg)} }
    @keyframes copy { 0%,20%{opacity:0;transform:scale(.2) rotate(-5deg)} 30%{opacity:1;transform:scale(1.12) rotate(-5deg)} 36%,100%{opacity:1;transform:scale(1) rotate(-5deg)} }
    @keyframes bang { 0%,12%{opacity:0;transform:rotate(-18deg) scale(.35)} 16%{opacity:1;transform:rotate(-18deg) scale(1.18)} 22%{transform:rotate(-18deg) scale(1)} 72%{opacity:1} 100%{opacity:0} }
    @keyframes dream { 0%,18%{opacity:0} 28%{opacity:1} 100%{opacity:.7} }
    @keyframes shadow { 0%{opacity:0} 16%{opacity:.85} 100%{opacity:.7} }
    @keyframes next { 0%,22%{opacity:0;transform:scale(.4)} 32%{opacity:1;transform:scale(1.08)} 38%,100%{opacity:1;transform:scale(1)} }
    @keyframes react { 0%,24%{opacity:0;transform:scale(.7)} 34%{opacity:1;transform:scale(1.08)} 40%,100%{opacity:1;transform:scale(1)} }
    @keyframes debris { 0%,12%{opacity:0;transform:scale(.8)} 18%{opacity:.95;transform:scale(1)} 70%{opacity:.4} 100%{opacity:.15} }
    @keyframes flash { 0%,12%{opacity:0} 15%{opacity:.55} 22%{opacity:0} 100%{opacity:0} }
    @keyframes shake { 0%,12%{transform:none} 15%{transform:translate(10px,4px)} 17%{transform:translate(-12px,-3px)} 20%{transform:translate(6px,2px)} 24%{transform:none} 100%{transform:none} }
    @keyframes kick { 0%{opacity:0;transform:translateX(-50%) scale(.72)} 8%{opacity:1;transform:translateX(-50%) scale(1.08)} 12%{transform:translateX(-50%) scale(1)} 78%{opacity:1} 100%{opacity:0;transform:translateX(-50%) scale(.94) translateY(-12px)} }
    @media (max-width:860px) {
      body { grid-template-columns:1fr; grid-template-rows:minmax(280px,42vh) 1fr; }
      aside { order:2; border-right:0; border-top:1px solid var(--line); }
      .stage-wrap { order:1; min-height:280px; }
    }
  </style>
</head>
<body>
<aside>
  <h1>过场预览</h1>
  <p class="lead">浏览器里看时间轴和构图。游戏里按 <b>F8</b> 播真实 Tween。<br>
    <a href="index.html">素材图鉴</a> · 片单与 <code>EventFx.gd</code> 对齐。</p>
  <div class="row">
    <button id="replay">重播</button>
    <button id="stop">停止</button>
  </div>
  <label class="loop"><input id="loop" type="checkbox" /> 循环</label>
  <div id="clips"></div>
</aside>
<div class="stage-wrap">
  <div class="stage" id="stage">
    <div class="veil"></div>
    <img class="shadow" alt="" src="../assets/game/ui/fired/shadow.png">
    <img class="paper" alt="" src="../assets/game/ui/fired/notice.png">
    <img class="imprint" alt="" src="../assets/game/ui/fired/imprint.png">
    <div class="copy"><h2 id="firedTitle">你被开除了！</h2><p id="firedSub">FIRE</p></div>
    <img class="bang" alt="" src="../assets/game/ui/fired/bang.png">
    <div class="dream">梦想…<br>到此为止</div>
    <img class="next" alt="" src="../assets/game/ui/fired/next.png">
    <img class="react" alt="" src="../assets/game/ui/fired/react.png">
    <img class="debris" alt="" src="../assets/game/ui/fired/debris.png">
    <img class="stamp" alt="" src="../assets/game/ui/fired/stamp.png">
    <div class="kick">
      <img class="clock" alt="" src="../assets/game/ui/kickoff/clock.png">
      <img class="ttl" id="kickTitle" alt="" src="../assets/game/ui/kickoff/title_10.png">
    </div>
    <div class="flash"></div>
  </div>
  <div class="hud">
    <b id="hudTitle">选一条过场</b>
    <div id="hudHint">点左侧条目。CSS 近似手感，调时长以游戏为准。</div>
    <div class="assets" id="hudAssets"></div>
  </div>
</div>
<script>
const CLIPS = [
  { id:"fired_victim", title:"开除 · 本人", group:"终局", ready:true, hint:"大红章砸下 · 震屏 · 印泥", kind:"fired", who:"你被开除了！", sub:"FIRE" },
  { id:"fired_boss", title:"开除 · 老板视角", group:"终局", ready:true, hint:"缩小版印泥", kind:"fired", who:"鹈鹕 被开除", sub:"已从编制移除" },
  { id:"kickoff_10", title:"开局 · 10 分钟", group:"开局", ready:true, hint:"时钟弹出，标准局", kind:"kick", titleSrc:"../assets/game/ui/kickoff/title_10.png" },
  { id:"kickoff_3", title:"开局 · 短局", group:"开局", ready:true, hint:"3 分钟标题", kind:"kick", titleSrc:"../assets/game/ui/kickoff/title_3.png" },
  { id:"blackout", title:"停电了", group:"事件", ready:false, hint:"未接入" },
  { id:"tea", title:"下午茶", group:"事件", ready:false, hint:"未接入 · 轻提示" },
  { id:"win", title:"打卡下班", group:"终局", ready:false, hint:"未接入" },
  { id:"escape", title:"逃跑成功", group:"终局", ready:false, hint:"未接入" },
];
const ASSETS = {
  fired: ["../assets/game/ui/fired/stamp.png","../assets/game/ui/fired/bang.png","../assets/game/ui/fired/notice.png","../assets/game/ui/fired/shadow.png"],
  kick: ["../assets/game/ui/kickoff/clock.png","../assets/game/ui/kickoff/title_10.png"],
};
let current = null;
let timer = 0;
const box = document.getElementById("clips");
let last = "";
CLIPS.forEach(c => {
  if (c.group !== last) {
    const g = document.createElement("div");
    g.className = "group";
    g.textContent = c.group;
    box.appendChild(g);
    last = c.group;
  }
  const b = document.createElement("button");
  b.className = "clip";
  b.disabled = !c.ready;
  b.innerHTML = `<b>${c.title}</b><span>${c.hint}</span>`;
  b.onclick = () => play(c.id);
  box.appendChild(b);
  c.el = b;
});
document.getElementById("replay").onclick = () => current && play(current.id);
document.getElementById("stop").onclick = stop;
document.getElementById("loop").onchange = () => {};
function play(id) {
  const clip = CLIPS.find(c => c.id === id);
  if (!clip || !clip.ready) return;
  stop();
  current = clip;
  CLIPS.forEach(c => c.el.classList.toggle("on", c.id === id));
  document.getElementById("hudTitle").textContent = clip.title;
  document.getElementById("hudHint").textContent = clip.hint;
  const assets = document.getElementById("hudAssets");
  assets.innerHTML = "";
  (ASSETS[clip.kind] || []).forEach(src => {
    const img = document.createElement("img");
    img.src = src;
    assets.appendChild(img);
  });
  if (clip.kind === "fired") {
    document.getElementById("firedTitle").textContent = clip.who;
    document.getElementById("firedSub").textContent = clip.sub;
    document.body.classList.add("play-fired");
    arm(2600);
  } else if (clip.kind === "kick") {
    document.getElementById("kickTitle").src = clip.titleSrc;
    document.body.classList.add("play-kick");
    arm(2800);
  }
}
function arm(ms) {
  clearTimeout(timer);
  timer = setTimeout(() => {
    if (document.getElementById("loop").checked && current) play(current.id);
    else stop(false);
  }, ms);
}
function stop(clearCurrent = true) {
  clearTimeout(timer);
  document.body.classList.remove("play-fired", "play-kick");
  void document.body.offsetWidth;
  if (clearCurrent) {
    current = null;
    CLIPS.forEach(c => c.el.classList.remove("on"));
  }
}
</script>
</body>
</html>

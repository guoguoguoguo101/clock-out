game/chars/rabbit/run_3.png?t=1789379825"], "count": 4}, {"folder": "game/chars/rabbit", "stem": "sleep", "kind": "chars", "group": "小兔子", "frames": ["../assets/game/chars/rabbit/sleep_0.png?t=1789379836", "../assets/game/chars/rabbit/sleep_1.png?t=1789379836", "../assets/game/chars/rabbit/sleep_2.png?t=1789379836", "../assets/game/chars/rabbit/sleep_3.png?t=1789379837"], "count": 4}, {"folder": "game/chars/rabbit", "stem": "toilet", "kind": "chars", "group": "小兔子", "frames": ["../assets/game/chars/rabbit/toilet_0.png?t=1789379840", "../assets/game/chars/rabbit/toilet_1.png?t=1789379841", "../assets/game/chars/rabbit/toilet_2.png?t=1789379841", "../assets/game/chars/rabbit/toilet_3.png?t=1789379841"], "count": 4}, {"folder": "game/chars/rabbit", "stem": "walk", "kind": "chars", "group": "小兔子", "frames": ["../assets/game/chars/rabbit/walk_0.png?t=1789379819", "../assets/game/chars/rabbit/walk_1.png?t=1789379819", "../assets/game/chars/rabbit/walk_2.png?t=1789379819", "../assets/game/chars/rabbit/walk_3.png?t=1789379820"], "count": 4}, {"folder": "game/chars/rabbit", "stem": "work", "kind": "chars", "group": "小兔子", "frames": ["../assets/game/chars/rabbit/work_0.png?t=1789379828", "../assets/game/chars/rabbit/work_1.png?t=1789379829", "../assets/game/chars/rabbit/work_2.png?t=1789379830", "../assets/game/chars/rabbit/work_3.png?t=1789379831"], "count": 4}, {"folder": "game/chars/tiger", "stem": "idle", "kind": "chars", "group": "老虎", "frames": ["../assets/game/chars/tiger/idle_0.png?t=1789372456", "../assets/game/chars/tiger/idle_1.png?t=1789372457", "../assets/game/chars/tiger/idle_2.png?t=1789372457", "../assets/game/chars/tiger/idle_3.png?t=1789372458"], "count": 4}, {"folder": "game/chars/tiger", "stem": "run", "kind": "chars", "group": "老虎", "frames": ["../assets/game/chars/tiger/run_0.png?t=1789372458", "../assets/game/chars/tiger/run_1.png?t=1789372459", "../assets/game/chars/tiger/run_2.png?t=1789372459", "../assets/game/chars/tiger/run_3.png?t=1789372459"], "count": 4}, {"folder": "game/chars/tiger", "stem": "walk", "kind": "chars", "group": "老虎", "frames": ["../assets/game/chars/tiger/walk_0.png?t=1789372455", "../assets/game/chars/tiger/walk_1.png?t=1789372455", "../assets/game/chars/tiger/walk_2.png?t=1789372456", "../assets/game/chars/tiger/walk_3.png?t=1789372456"], "count": 4}]};
const KINDS = [
  { id:"all", label:"全部" },
  { id:"chars", label:"角色" },
  { id:"props", label:"道具" },
  { id:"ui", label:"界面" },
  { id:"concept", label:"概念图" },
  { id:"audio", label:"音频" },
  { id:"archived", label:"废弃" },
  { id:"other", label:"其他" },
];
let kind = "all";
let folder = "";
let q = "";
const timers = [];

document.getElementById("meta").textContent =
  `${DATA.count} 个文件 · 生成于 ${DATA.generated_at} · 改完素材后运行 python tools/build_asset_preview.py`;

const tabs = document.getElementById("tabs");
KINDS.forEach(k => {
  if (k.id !== "all" && !DATA.kinds[k.id]) return;
  const b = document.createElement("button");
  b.textContent = k.id === "all" ? `全部 ${DATA.count}` : `${k.label} ${DATA.kinds[k.id]||0}`;
  b.dataset.id = k.id;
  b.className = k.id === kind ? "on" : "";
  b.onclick = () => { kind = k.id; folder = ""; render(); };
  tabs.appendChild(b);
});

const lb = document.getElementById("lightbox");
lb.onclick = () => lb.classList.remove("on");

document.getElementById("q").addEventListener("input", e => {
  q = e.target.value.trim().toLowerCase();
  render();
});

function filtered() {
  return DATA.items.filter(it => {
    if (kind !== "all" && it.kind !== kind) return false;
    if (folder && it.folder !== folder) return false;
    if (!q) return true;
    return (it.rel + " " + it.name + " " + it.group).toLowerCase().includes(q);
  });
}

function renderNav() {
  const folders = {};
  DATA.items.forEach(it => {
    if (kind !== "all" && it.kind !== kind) return;
    folders[it.folder] = (folders[it.folder] || 0) + 1;
  });
  const nav = document.getElementById("nav");
  const keys = Object.keys(folders).sort();
  nav.innerHTML = `<a href="#" class="${folder===""?"on":""}" data-folder="">全部目录</a>` +
    keys.map(f => `<a href="#" class="${folder===f?"on":""}" data-folder="${f}">${f} · ${folders[f]}</a>`).join("");
  nav.querySelectorAll("a").forEach(a => {
    a.onclick = ev => {
      ev.preventDefault();
      folder = a.dataset.folder;
      render();
    };
  });
}

function card(it) {
  const src = it.src + "?t=" + it.mtime;
  const size = it.w ? `${it.w}×${it.h}` : (Math.max(1, Math.round(it.bytes/1024)) + " KB");
  const archived = it.kind === "archived";
  const cls = (it.audio ? "wide" : "") + (archived ? " archived" : "");
  const tag = archived ? `<span class="tag">废弃</span> ` : "";
  if (it.audio) {
    return `<figure class="${cls}"><audio controls src="${src}"></audio><figcaption>${tag}${it.file}<br>${it.rel}</figcaption></figure>`;
  }
  return `<figure class="${cls}" data-src="${src}" data-info="${it.rel} · ${size}">
    <img class="thumb" src="${src}" alt="${it.name}">
    <figcaption>${tag}${it.file}<br>${size}</figcaption>
  </figure>`;
}

function render() {
  timers.splice(0).forEach(clearInterval);
  [...tabs.children].forEach(b => b.classList.toggle("on", b.dataset.id === kind));
  renderNav();
  const items = filtered();
  const board = document.getElementById("board");
  if (!items.length) {
    board.innerHTML = `<p class="empty">没有匹配的素材</p>`;
    return;
  }
  const seqs = DATA.sequences.filter(s => {
    if (kind !== "all" && s.kind !== kind) return false;
    if (folder && s.folder !== folder) return false;
    if (q && !(s.stem + s.folder).toLowerCase().includes(q)) return false;
    return true;
  });
  const byGroup = {};
  items.forEach(it => {
    const g = it.kind_label + " · " + it.group;
    (byGroup[g] = byGroup[g] || []).push(it);
  });
  let html = "";
  if (seqs.length) {
    html += `<h2>循环播放</h2><div class="row" id="loops"></div>`;
  }
  Object.keys(byGroup).sort().forEach(g => {
    html += `<h2>${g} · ${byGroup[g].length}</h2><div class="row">${byGroup[g].map(card).join("")}</div>`;
  });
  board.innerHTML = html;
  board.querySelectorAll("figure[data-src]").forEach(fig => {
    fig.onclick = () => {
      lb.classList.add("on");
      lb.querySelector("img").src = fig.dataset.src;
      lb.querySelector(".info").textContent = fig.dataset.info;
    };
  });
  const loops = document.getElementById("loops");
  if (loops) {
    seqs.forEach(s => {
      const el = document.createElement("div");
      el.className = "stage";
      el.innerHTML = `<img alt="${s.stem}"><p>${s.group} / ${s.stem} · ${s.count}帧</p>`;
      const img = el.querySelector("img");
      let i = 0;
      img.src = s.frames[0];
      timers.push(setInterval(() => {
        i = (i + 1) % s.frames.length;
        img.src = s.frames[i];
      }, 140));
      loops.appendChild(el);
    });
  }
}
render();
</script>

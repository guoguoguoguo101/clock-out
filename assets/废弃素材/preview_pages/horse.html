<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>六点下班 · 小马高清资产</title>
  <style>
    :root { --bg:#07080c; --card:#12141c; --ink:#f4f7fb; --muted:#8b93a7; --line:#1d2230; --cyan:#3ddaf0; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
    main { max-width:1280px; margin:0 auto; padding:40px 24px 96px; }
    h1 { font-size:32px; margin:0 0 8px; }
    .lead { color:var(--muted); line-height:1.65; max-width:820px; }
    h2 { color:var(--cyan); font-size:20px; margin:40px 0 12px; }
    .row { display:flex; flex-wrap:wrap; gap:14px; }
    figure { margin:0; width:168px; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:10px; text-align:center; }
    figure.wide { width:220px; }
    figure.scene { width:240px; }
    figure img { width:100%; height:148px; object-fit:contain; background:
      linear-gradient(45deg,#eceff4 25%,transparent 25%),
      linear-gradient(-45deg,#eceff4 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#eceff4 75%),
      linear-gradient(-45deg,transparent 75%,#eceff4 75%);
      background-size:16px 16px; background-position:0 0,0 8px,8px -8px,-8px 0;
      background-color:#fff; border-radius:12px; }
    figcaption { color:var(--muted); font-size:12px; margin-top:6px; }
    a { color:var(--cyan); }
  </style>
</head>
<body>
<main>
  <h1>小马高清资产</h1>
  <p class="lead">从设定图逐格识别后重绘，每张 1024×1024 透明 PNG。原图裁切在 <code>assets/horse/crops</code>，分类表在 <code>assets/horse/sheets</code>，成品在 <code>assets/horse/hd</code>，游戏用拷贝在 <code>assets/game/chars/horse</code>。</p>
  <p class="lead"><a href="../assets/concept/horse-bible.jpg">打开原始设定图</a></p>

  <h2>0. 主角色</h2>
  <div class="row" id="portrait"></div>
  <h2>1. 站立 Idle</h2>
  <div class="row" id="idle"></div>
  <h2>2. 行走 Walk</h2>
  <div class="row" id="walk"></div>
  <h2>3. 跑动 Run</h2>
  <div class="row" id="run"></div>
  <h2>4. 交互动作</h2>
  <div class="row" id="acts"></div>
  <h2>5. 表情包</h2>
  <div class="row" id="faces"></div>
  <h2>6. 道具</h2>
  <div class="row" id="props"></div>
  <h2>7. 围巾六色</h2>
  <div class="row" id="colors"></div>
  <h2>8. 服饰</h2>
  <div class="row" id="acc"></div>
  <h2>9. 场景移动</h2>
  <div class="row" id="scenes"></div>
  <h2>10. UI</h2>
  <div class="row" id="ui"></div>
  <h2>11. 其他</h2>
  <div class="row" id="extras"></div>
</main>
<script>
  const HD = "../assets/horse/hd/";
  const fig = (dir, name, extra="") =>
    `<figure class="${extra}"><img src="${HD}${dir}/${name}.png" alt="${name}"><figcaption>${name}</figcaption></figure>`;
  const fill = (id, dir, names, extra="") => {
    document.getElementById(id).innerHTML = names.map(n => fig(dir, n, extra)).join("");
  };
  fill("portrait", "00_portrait", ["hero"]);
  fill("idle", "01_idle", ["idle_0","idle_1","idle_2","idle_3"]);
  fill("walk", "02_walk", ["walk_0","walk_1","walk_2","walk_3"]);
  fill("run", "03_run", ["run_0","run_1","run_2","run_3"]);
  fill("acts", "04_acts", ["work","read","coffee","think","cheer","sleep"]);
  fill("faces", "05_faces", ["idle","happy","proud","angry","confused","question","shock","awkward","love"]);
  fill("props", "06_props", ["bag","coffee","laptop","paper","pencil","books","plant","headset","phone","drink","cookie","gift","coin","star","heart","bulb"]);
  fill("colors", "07_colors", ["cyan","yellow","red","purple","green","pink"]);
  fill("acc", "08_acc", ["hat","headset","backpack","crown"]);
  fill("scenes", "09_scenes", ["move","stairs","jump","interact","door"], "scene");
  fill("ui", "10_ui", ["collect","task","bag","settings","hud","heart","bolt","smile","mail"], "wide");
  fill("extras", "11_extras", ["peek","hide","dash","lie","bubble"]);
</script>
</body>
</html>
